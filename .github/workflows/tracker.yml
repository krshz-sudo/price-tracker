name: Price Tracker

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Scheduled runs can be delayed under load.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap (they would race on prices.json).
concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit prices.json if changed
        run: |
          if [ -z "$(git status --porcelain -- prices.json)" ]; then
            echo "prices.json unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "chore: update prices.json [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "Could not push prices.json after 3 attempts."
          exit 1
